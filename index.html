<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFE8DA">
  <title>Bot 办公楼</title>
  <style>
    :root {
      --bg: #EFE8DA;
      --ink: #1C1917;
      --muted: #78716C;
      --line: #E4D9C6;
      --card: #FFFBF3;
      --wood: #D9C9A8;
      --working: #16A34A;
      --idle: #A8A29E;
      --waiting_user: #D97706;
      --error: #DC2626;
      --done: #2563EB;
      --stuck: #EA580C;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
      min-height: 100dvh;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }
    header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
    .live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--working); box-shadow: 0 0 0 4px rgba(22,163,74,.15); animation: pulse 1.6s ease-in-out infinite; }
    .dot.off { background: #A8A29E; box-shadow: none; animation: none; }
    .dot.err { background: var(--error); box-shadow: 0 0 0 4px rgba(220,38,38,.12); animation: pulse 1s ease-in-out infinite; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 10px; font-size: 12px; color: var(--ink);
    }
    .chip b { font-weight: 650; }
    .chip .n { color: var(--muted); margin-left: 4px; }

    .spotlight {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 80% 0%, rgba(45,132,245,.18), transparent 55%),
        linear-gradient(180deg, #FFFCF6, #F7F0E3);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(28,25,23,.08);
      padding: 16px 16px 14px;
      margin-bottom: 14px;
      min-height: 168px;
    }
    .spotlight .label {
      font-size: 11px; font-weight: 700; letter-spacing: .12em; color: #5B82C4; margin: 0 0 8px;
    }
    .spot-row { display: flex; align-items: center; gap: 14px; }
    .spot-copy { flex: 1; min-width: 0; }
    .spot-copy h2 { margin: 0; font-size: 20px; }
    .spot-step { margin: 8px 0 0; font-size: 15px; line-height: 1.55; }
    .spot-when { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; border-radius: 999px;
      padding: 4px 8px; white-space: nowrap;
    }
    .working { color: var(--working); background: rgba(22,163,74,.12); }
    .idle { color: #78716C; background: rgba(168,162,158,.16); }
    .waiting_user { color: var(--waiting_user); background: rgba(217,119,6,.14); }
    .error, .stuck { color: var(--error); background: rgba(220,38,38,.12); }
    .done { color: var(--done); background: rgba(37,99,235,.12); }

    .stage {
      width: 112px; height: 112px; flex: none; position: relative;
      display: grid; place-items: end center;
    }
    .desk {
      position: absolute; left: 14px; right: 14px; bottom: 10px; height: 18px;
      background: #C4A574; border-radius: 4px 4px 6px 6px;
      box-shadow: 0 4px 0 #A8885A;
    }
    .monitor {
      position: absolute; left: 50%; bottom: 26px; width: 46px; height: 32px;
      transform: translateX(-50%);
      background: #2A2E35; border-radius: 4px; overflow: hidden;
      box-shadow: 0 0 0 2px #1A1D22;
    }
    .monitor::after {
      content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 7px;
      transform: translateX(-50%); background: #4B5563;
    }
    .screen { position: absolute; inset: 3px; border-radius: 2px; background: #111827; overflow: hidden; }
    .scan {
      position: absolute; left: 3px; right: 3px; height: 5px; background: #7DD3FC;
      opacity: .0;
    }
    .person { position: absolute; left: 18px; bottom: 22px; width: 28px; height: 46px; z-index: 2; }
    .head {
      width: 16px; height: 16px; margin: 0 auto; border-radius: 50%;
      background: var(--c, #2D84F5); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    }
    .torso {
      width: 18px; height: 18px; margin: 1px auto 0; border-radius: 7px 7px 4px 4px;
      background: var(--c, #2D84F5);
    }
    .arm {
      position: absolute; width: 6px; height: 14px; border-radius: 4px; background: var(--c, #2D84F5);
      top: 18px;
    }
    .arm.left { left: 1px; transform-origin: top center; }
    .arm.right { right: 1px; transform-origin: top center; }

    .is-working .person { animation: bob 0.7s ease-in-out infinite; }
    .is-working .arm.right { animation: type 0.35s ease-in-out infinite; }
    .is-working .arm.left { animation: type 0.35s ease-in-out infinite reverse; }
    .is-working .screen { background: #082F49; box-shadow: 0 0 16px rgba(56,189,248,.55); }
    .is-working .scan { animation: scan 1.1s linear infinite; opacity: .85; }
    .is-working .monitor { animation: glow 1.4s ease-in-out infinite; }
    .is-idle .person { animation: breathe 3.2s ease-in-out infinite; }
    .is-idle .screen { background: #1F2937; }
    .is-waiting_user .person { animation: lean 1.6s ease-in-out infinite; }
    .is-waiting_user .arm.right { animation: wave 1s ease-in-out infinite; }
    .is-waiting_user .screen { background: #78350F; }
    .is-waiting_user .stage::before {
      content: ""; position: absolute; inset: 8px; border-radius: 50%;
      border: 2px dashed rgba(217,119,6,.45); animation: spin 8s linear infinite;
    }
    .is-done .person { animation: hop 0.9s ease-in-out 2; }
    .is-done .screen { background: #1E3A8A; box-shadow: 0 0 14px rgba(37,99,235,.5); }
    .is-error .person, .is-stuck .person { animation: shake 0.5s ease-in-out infinite; }
    .is-error .screen, .is-stuck .screen { background: #7F1D1D; }
    .is-error .stage, .is-stuck .stage { animation: alarm 1s ease-in-out infinite; }

    .flash { animation: flash 1.1s ease; }

    .office {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .room {
      background:
        linear-gradient(#efe4cc, #efe4cc) 0 28px / 100% 1px no-repeat,
        #F7F1E6;
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 148px;
      padding: 8px 8px 10px;
      box-shadow: 0 8px 20px rgba(28,25,23,.04);
    }
    .room h3 {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .12em;
    }
    .seats { display: flex; justify-content: space-around; align-items: flex-end; gap: 4px; min-height: 108px; }
    .seat { width: 100%; max-width: 120px; text-align: center; cursor: pointer; border-radius: 14px; padding: 2px; }
    .seat .mini-stage { width: 84px; height: 90px; margin: 0 auto; position: relative; }
    .seat .mini-stage .person { left: 8px; transform: scale(.86); transform-origin: bottom left; }
    .seat .mini-stage .monitor { width: 34px; height: 24px; }
    .seat .nm { margin-top: 2px; font-size: 11px; font-weight: 650; line-height: 1.2; }
    .seat .st { font-size: 10px; color: var(--muted); }
    .seat.is-focus { outline: 2px solid rgba(45,132,245,.45); background: rgba(45,132,245,.06); }

    .sheet {
      display: none;
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .sheet.show { display: block; animation: rise .25s ease; }
    .sheet h4 { margin: 0; font-size: 16px; }
    .sheet .step { margin: 8px 0 0; font-size: 14px; line-height: 1.55; }
    .sheet .when { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .banner {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; color: var(--muted); line-height: 1.6; margin-bottom: 12px;
    }
    footer { margin-top: 16px; font-size: 11px; color: var(--muted); line-height: 1.5; }

    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes type { 0%,100% { transform: rotate(18deg) translateY(0); } 50% { transform: rotate(-8deg) translateY(3px); } }
    @keyframes scan { 0% { top: 2px; } 100% { top: 22px; } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px rgba(56,189,248,.3)); } 50% { filter: drop-shadow(0 0 8px rgba(56,189,248,.8)); } }
    @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes lean { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-8deg) translateX(2px); } }
    @keyframes wave { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-50deg); } }
    @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    @keyframes alarm { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 8px rgba(220,38,38,.45)); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: .75; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(45,132,245,.0); } 30% { box-shadow: 0 0 0 6px rgba(45,132,245,.2); } 100% { box-shadow: 0 0 0 0 rgba(45,132,245,.0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Bot 办公楼</h1>
      <div class="live" id="live"><span class="dot off"></span><span>尚未连接</span></div>
    </div>
    <div class="summary" id="summary"></div>
  </header>
  <div id="banner"></div>
  <section class="spotlight is-idle" id="spotlight" hidden></section>
  <section class="office" id="office" hidden></section>
  <section class="sheet" id="sheet"></section>
  <footer>状态按完整中文名字区分，不会把不同 Bot 叠成同一个人。链接相当于密码，请不要转发。</footer>
  <script>
    const FOCUS = "技术研发Bot";
    const TEAMS = [
      { id: "Ops", name: "统筹", bots: ["总裁助理"] },
      { id: "Investing", name: "投资", bots: ["投资研究Bot"] },
      { id: "Engineering", name: "研发", bots: ["技术研发Bot"] },
      { id: "Research", name: "研究", bots: ["知识研究Bot", "语言Bot"] },
      { id: "Media", name: "内容", bots: ["自媒体运营Bot", "视频制作Bot"] },
      { id: "Life", name: "生活", bots: ["生活Bot", "邮件Bot"] },
    ];
    const COLORS = {
      "总裁助理": "#1B4F8A",
      "投资研究Bot": "#C9A227",
      "技术研发Bot": "#2D84F5",
      "知识研究Bot": "#5B4B8A",
      "视频制作Bot": "#E85D04",
      "语言Bot": "#0D9488",
      "生活Bot": "#16A34A",
      "自媒体运营Bot": "#E11D48",
      "邮件Bot": "#6366F1",
    };
    const SHORT = {
      "总裁助理": "总", "投资研究Bot": "投", "技术研发Bot": "研",
      "知识研究Bot": "知", "视频制作Bot": "视", "语言Bot": "语",
      "生活Bot": "生", "自媒体运营Bot": "媒", "邮件Bot": "邮",
    };
    const STATUS_LABEL = {
      working: "工作中", idle: "休息", waiting_user: "等你确认",
      error: "出错", done: "刚完成", stuck: "可能卡住",
    };
    const KNOWN = TEAMS.flatMap((t) => t.bots);
    const TEAM_OF = Object.fromEntries(TEAMS.flatMap((t) => t.bots.map((b) => [b, t.name])));
    const STEP_ZH = [
      [/V30 deploy: prebackup, commit, save, deploy, verify/i, "正在做 V30 发布前备份、提交、保存、部署和核验"],
      [/await save or deploy authorization/i, "等待你授权保存或部署"],
      [/confirm v30 local done to user/i, "正在向你确认 v30 本地已完成"],
      [/v30 local done, tests passed EXIT 0, not saved or deployed/i, "v30 本地已完成，测试通过，尚未保存或部署"],
      [/status check.*/i, "连通检查"],
      [/Setting up the 3D office dashboard/i, "正在接入 3D 办公楼"],
      [/Publishing setup usage and routines/i, "正在发布用量和定时任务"],
      [/3D office setup complete/i, "3D 办公楼已接入完成"],
      [/Reviewing status-check replies/i, "正在查看连通检查回复"],
      [/Noted paused routines after status check/i, "已记录暂停中的例行任务"],
      [/Answered mobile browser can open the 3D office/i, "已说明手机浏览器可以打开办公楼"],
      [/Building a Chinese 2D office dashboard/i, "正在制作中文平面看板"],
      [/no active editing tasks/i, "没有进行中的剪辑任务"],
      [/todo list cleared, yoga mat done/i, "待办已清空"],
      [/mark yoga mat todo done/i, "正在更新待办"],
      [/replied status to .*/i, "已回复状态检查"],
      [/已回复总裁助理.*/i, null],
    ];

    const bots = {};
    for (const name of KNOWN) bots[name] = { name, status: "idle", step: "", at: 0, seen: false };
    const lastSig = {};
    const flashes = {};
    let selected = FOCUS;

    const $ = (id) => document.getElementById(id);
    const live = $("live");

    function topicFromLink() {
      const hash = decodeURIComponent((location.hash || "").replace(/^#/, "")).split("&")[0].trim();
      if (/^[A-Za-z0-9_-]{6,64}$/.test(hash)) return hash;
      const q = new URLSearchParams(location.search).get("topic");
      if (q && /^[A-Za-z0-9_-]{6,64}$/.test(q)) return q;
      return null;
    }

    function translateStep(step) {
      const s = (step || "").trim();
      if (!s) return "";
      for (const [re, zh] of STEP_ZH) {
        if (re.test(s)) return zh === null ? s : zh;
      }
      return s;
    }

    function displayStatus(bot, now = Date.now()) {
      let status = bot.status || "idle";
      let note = "";
      if (status === "working" && bot.at && now - bot.at > 20 * 60 * 1000) {
        status = "stuck";
        note = "较久未更新，可能已经结束但没上报";
      }
      if (status === "done" && bot.at && now - bot.at > 60 * 1000) status = "idle";
      return { status, note };
    }

    function fmtTime(ms) {
      if (!ms) return "暂无上报";
      const diff = Date.now() - ms;
      if (diff < 60 * 1000) return "刚刚";
      if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + " 分钟前";
      const d = new Date(ms);
      const t = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
      }).format(d);
      const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai" }).format(new Date());
      const day = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai" }).format(d);
      return day === today ? "今天 " + t : day.slice(5).replace("-", "月") + "日 " + t;
    }

    function applyMessage(text, timeSec) {
      let obj;
      try { obj = JSON.parse(text); } catch { return; }
      const at = timeSec ? timeSec * 1000 : Date.now();
      if (obj && obj.bot && obj.status) {
        const name = String(obj.bot);
        if (!bots[name]) bots[name] = { name, status: "idle", step: "", at: 0, seen: false };
        bots[name].status = String(obj.status);
        bots[name].step = obj.step ? String(obj.step) : "";
        bots[name].at = at;
        bots[name].seen = true;
      }
    }

    function figure(color) {
      return `<div class="stage">
        <div class="person" style="--c:${color}">
          <div class="arm left"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm right"></div>
        </div>
        <div class="monitor"><div class="screen"><div class="scan"></div></div></div>
        <div class="desk"></div>
      </div>`;
    }

    function stepText(bot, now) {
      const { status, note } = displayStatus(bot, now);
      return translateStep(bot.step) || note || (status === "idle" ? "当前没有进行中的任务" : "");
    }

    function markFlash(name, status, at, step) {
      const sig = status + "|" + at + "|" + step;
      if (lastSig[name] && lastSig[name] !== sig) flashes[name] = Date.now();
      lastSig[name] = sig;
      return flashes[name] && Date.now() - flashes[name] < 1200;
    }

    function render() {
      const now = Date.now();
      const known = Object.values(bots);
      const counts = { working: 0, waiting_user: 0, idle: 0, error: 0, done: 0, stuck: 0 };
      for (const b of known) counts[displayStatus(b, now).status]++;
      const rows = [
        ["工作中", counts.working],
        ["等你确认", counts.waiting_user],
        ["休息", counts.idle],
      ];
      if (counts.done) rows.push(["刚完成", counts.done]);
      if (counts.error + counts.stuck) rows.push(["需留意", counts.error + counts.stuck]);
      $("summary").innerHTML = rows.map(([k, n]) => `<span class="chip"><b>${k}</b><span class="n">${n}</span></span>`).join("");

      const focus = bots[FOCUS] || { name: FOCUS, status: "idle", step: "", at: 0 };
      const fs = displayStatus(focus, now);
      const fFlash = markFlash(FOCUS, fs.status, focus.at, focus.step);
      $("spotlight").hidden = false;
      $("spotlight").className = "spotlight is-" + fs.status + (fFlash ? " flash" : "");
      $("spotlight").innerHTML = `
        <div class="label">重点关注</div>
        <div class="spot-row">
          ${figure(COLORS[FOCUS])}
          <div class="spot-copy">
            <h2>${FOCUS}</h2>
            <div style="margin-top:6px"><span class="badge ${fs.status}">${STATUS_LABEL[fs.status] || fs.status}</span></div>
            <p class="spot-step">${escapeHtml(stepText(focus, now))}</p>
            <div class="spot-when">${fmtTime(focus.at)}</div>
          </div>
        </div>`;

      const extras = known.filter((b) => !KNOWN.includes(b.name));
      const teams = extras.length ? TEAMS.concat([{ id: "Other", name: "其他", bots: extras.map((b) => b.name) }]) : TEAMS;
      $("office").hidden = false;
      $("office").innerHTML = teams.map((team) => {
        const seats = team.bots.map((name) => {
          const bot = bots[name];
          const { status } = displayStatus(bot, now);
          const flash = markFlash(name, status, bot.at, bot.step);
          const color = COLORS[name] || "#78716C";
          return `<button type="button" class="seat is-${status}${name === FOCUS ? " is-focus" : ""}${flash ? " flash" : ""}" data-bot="${escapeHtml(name)}">
            <div class="mini-stage">${figure(color)}</div>
            <div class="nm">${escapeHtml(name.replace(/Bot$/, ""))}</div>
            <div class="st">${STATUS_LABEL[status] || status}</div>
          </button>`;
        }).join("");
        return `<article class="room"><h3>${team.name}</h3><div class="seats">${seats}</div></article>`;
      }).join("");

      document.querySelectorAll(".seat").forEach((el) => {
        el.onclick = () => { selected = el.dataset.bot; renderSheet(); };
      });
      renderSheet();
    }

    function renderSheet() {
      const bot = bots[selected];
      if (!bot) { $("sheet").className = "sheet"; return; }
      const now = Date.now();
      const { status } = displayStatus(bot, now);
      $("sheet").className = "sheet show";
      $("sheet").innerHTML = `
        <h4>${escapeHtml(bot.name)}</h4>
        <div style="margin-top:6px"><span class="badge ${status}">${STATUS_LABEL[status] || status}</span>
        <span style="margin-left:8px;color:var(--muted);font-size:12px">${TEAM_OF[bot.name] || "其他"}</span></div>
        <p class="step">${escapeHtml(stepText(bot, now))}</p>
        <div class="when">${fmtTime(bot.at)}</div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function setLive(kind, text) {
      live.innerHTML = `<span class="dot ${kind === "ok" ? "" : kind === "err" ? "err" : "off"}"></span><span>${text}</span>`;
    }

    async function connect() {
      const topic = topicFromLink();
      if (!topic) {
        $("banner").innerHTML = `<div class="banner">请使用完整链接打开这个看板。链接相当于密码，打开后会自动连接实时状态。</div>`;
        render();
        return;
      }
      const base = "https://ntfy.sh/" + encodeURIComponent(topic);
      setLive("off", "正在连接…");
      try {
        const res = await fetch(base + "/json?poll=1&since=12h", { cache: "no-store" });
        if (!res.ok) throw new Error("http " + res.status);
        const lines = (await res.text()).trim().split("\n").filter(Boolean);
        for (const line of lines) {
          const ev = JSON.parse(line);
          if (ev.message) applyMessage(ev.message, ev.time);
        }
        render();
        setLive("ok", "实时更新中");
      } catch (err) {
        render();
        setLive("err", "暂时连不上状态频道，已显示最近一次结果");
      }
      try {
        const es = new EventSource(base + "/sse?since=10s");
        es.onmessage = (e) => {
          try {
            const ev = JSON.parse(e.data);
            if (ev.message) {
              applyMessage(ev.message, ev.time);
              render();
              setLive("ok", "实时更新中");
            }
          } catch {}
        };
        es.onerror = () => setLive("err", "连接中断，正在重试");
      } catch {
        setInterval(async () => {
          try {
            const res = await fetch(base + "/json?poll=1&since=5m", { cache: "no-store" });
            const lines = (await res.text()).trim().split("\n").filter(Boolean);
            for (const line of lines) {
              const ev = JSON.parse(line);
              if (ev.message) applyMessage(ev.message, ev.time);
            }
            render();
            setLive("ok", "实时更新中");
          } catch {}
        }, 8000);
      }
      setInterval(render, 30000);
    }

    connect();
  </script>
</body>
</html>
